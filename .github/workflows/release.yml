name: Release

# Push a tag like v0.2.0 (matching package.json's version) to publish a
# GitHub release with the packaged extension attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json
        run: |
          v="v$(node -p 'require("./package.json").version')"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != package.json $v"; exit 1; }
      - run: npm run build
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run zip
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" pdf120-v*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
