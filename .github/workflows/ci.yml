name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test (headless Chrome)
        run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test/out/
          if-no-files-found: ignore
      - name: Package extension
        run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: pdf120-extension
          path: pdf120-v*.zip
